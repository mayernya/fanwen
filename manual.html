<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>说明书 · 大肥鱼和捷米奈</title>
  <link rel="stylesheet" href="fonts/wenkai.css" />
  <link rel="stylesheet" href="style.css?v=20261123b" />
</head>
<body data-page="manual">

  <!-- fallback for disabled/failed JS; self-contained so it survives a broken style.css -->
  <noscript>
    <style>
      .ns-wrap { margin:0; padding:48px 24px; min-height:100vh; background:#10225e; color:#f8f1e0;
                 font:16px/1.8 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
      .ns-card { max-width:560px; margin:0 auto; padding:28px 26px; border-radius:16px;
                 background:rgba(255,255,255,.06); border:1px solid rgba(248,241,224,.25); }
      .ns-card h1 { margin:0 0 18px; font-size:24px; letter-spacing:2px; text-decoration:none; -webkit-text-stroke:0; }
      .ns-k { margin:0 0 18px; font-size:12px; letter-spacing:3px; opacity:.65; }
      .ns-card p { margin:0 0 14px; }
      .ns-card strong { color:#ffd9a0; }
      .ns-foot { margin-top:22px; font-size:12px; opacity:.6; }
    </style>
    <div class="ns-wrap">
      <div class="ns-card">
        <p class="ns-k">NOSCRIPT</p>
        <h1>说明书</h1>
        <p>这份说明书也是用 JavaScript 渲染的，所以暂时读不到内容。</p>
        <p><strong>把 JavaScript 打开，再刷新一次就好。</strong>如果是在公司或学校网络里，也可能是被安全策略拦掉了。</p>
        <p>站点本身是纯静态的，不收集访问信息，也不需要登录。</p>
        <p class="ns-foot">大肥鱼和捷米奈是 AI 角色设定 · 与哔哩哔哩无关</p>
      </div>
    </div>
  </noscript>
  <section class="phead">
    <div class="ptext">
      <div class="k">MANUAL</div>
      <h1>鱼缸说明书</h1>
      <p id="intro"></p>
    </div>
    <figure data-polaroid></figure>
  </section>

  <main class="wrap narrow">
    <h2 class="sec-title">住户档案</h2>
    <div class="profiles" id="profiles"></div>

    <h2 class="sec-title">常见问题</h2>
    <div class="faq" id="faq"></div>
  </main>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
    const T = TANK, $ = (id) => document.getElementById(id);
    $("intro").textContent = T.manual.intro;
    $("profiles").innerHTML = Object.values(T.characters).map((c, i) => `
      <article class="panel paper idcard rv" style="--bc:${c.bubble};--r:${i % 2 ? 1 : -1}deg">
        <div class="id-head">${UI.avatar(c, "av huge")}<div><h3>${UI.esc(c.name)}</h3><small>${UI.esc(c.handle)}</small></div></div>
        <dl>
          <dt>种类</dt><dd>${UI.esc(c.species)}</dd>
          <dt>生日</dt><dd>${UI.esc(c.birthday)}</dd>
          <dt>住在</dt><dd>${UI.esc(c.home)}</dd>
          <dt>喜欢</dt><dd>${UI.esc(c.likes)}</dd>
          <dt>讨厌</dt><dd>${UI.esc(c.dislikes)}</dd>
        </dl>
        <p class="phrase">“${UI.esc(c.catchphrase)}”</p>
      </article>`).join("");
    $("faq").innerHTML = T.manual.faq.map((f, i) => `
      <details class="rv"${i === 0 ? " open" : ""}><summary>${UI.esc(f.q)}</summary><p>${UI.esc(f.a)}</p></details>`).join("");
    UI.reveal();
  </script>
</body>
</html>
