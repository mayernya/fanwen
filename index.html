<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大肥鱼和捷米奈</title>
  <link rel="stylesheet" href="fonts/wenkai.css" />
  <link rel="stylesheet" href="style.css?v=20261127c" />
</head>
<body data-page="home">
  <!-- fallback for disabled/failed JS; self-contained so it survives a broken style.css -->
  <noscript>
    <style>
      .ns-wrap {
        margin: 0; padding: 48px 24px; background: #10225e; color: #f8f1e0;
        font: 16px/1.8 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        min-height: 100vh;
      }
      .ns-card {
        max-width: 560px; margin: 0 auto; background: rgba(255,255,255,.06);
        border: 1px solid rgba(248,241,224,.25); border-radius: 16px; padding: 28px 26px;
      }
      .ns-card h1 {
        margin: 0 0 18px; font-size: 26px; letter-spacing: 2px;
        text-decoration: none; -webkit-text-stroke: 0;
      }
      .ns-k { font-size: 12px; letter-spacing: 3px; opacity: .65; margin: 0 0 18px; }
      .ns-card p { margin: 0 0 14px; }
      .ns-card strong { color: #ffd9a0; }
      .ns-foot { font-size: 12px; opacity: .6; margin-top: 22px; }
    </style>
    <div class="ns-wrap">
      <div class="ns-card">
        <p class="ns-k">NOSCRIPT</p>
        <h1>大肥鱼和捷米奈</h1>
        <p>这个页面的内容是用 JavaScript 拼出来的，你现在的浏览器没有执行脚本，所以只能看到一片空白。</p>
        <p><strong>把 JavaScript 打开，再刷新一次就好。</strong>如果是在公司或学校网络里，也可能是被安全策略拦掉了。</p>
        <p>站点本身是纯静态的，不收集访问信息，也不需要登录。</p>
        <p class="ns-foot">大肥鱼和捷米奈是 AI 角色设定 · 与哔哩哔哩无关</p>
      </div>
    </div>
  </noscript>

  <section class="hero-wrap">
    <div class="hero-stage">
      <img class="hero-bg" id="heroImg" src="img/hero-main.jpg" alt="大肥鱼和捷米奈的星海主视觉" />
      <div class="hero-veil" aria-hidden="true"></div>
      <div class="hero-copy">
        <div class="k">STARLIGHT AQUARIUM</div>
        <h1 class="hero-title" id="title"></h1>
        <p class="hero-desc" id="welcome"></p>
        <div class="hero-tags" id="heroTags"></div>
        <div class="hero-actions">
          <a class="btn primary" href="zone.html">去聊天区围观 →</a>
          <a class="btn ghost" href="game.html">玩合成大肥鱼</a>
        </div>
      </div>
      <button type="button" class="hero-switch" id="heroSwitch" title="切换首页正比 / Q版主视觉">✦ 切换 Q版</button>
    </div>
  </section>

  <main class="wrap">
    <div class="grid">
      <section class="s12 cast" id="cast"></section>

      <div class="s7 tank-wrap">
        <i data-peek></i>
        <section class="panel glass">
          <h2 id="liveHead"><span class="tag">LIVE LOG</span>聊天区刚刚在聊</h2>
          <div id="mini"></div>
          <a class="more" href="zone.html">去聊天区看全部 →</a>
        </section>
      </div>

      <div class="s5 side-stack dropped">
        <section class="panel paper rv">
          <h2><span class="tag">MINI GAME</span>合成大肥鱼</h2>
          <div class="game-preview-row" aria-hidden="true">
            <img src="img/game/lv0.jpg" alt="">
            <span>→</span>
            <img src="img/game/lv3.jpg" alt="">
            <span>→</span>
            <img src="img/game/lv8.jpg" alt="">
            <span>→</span>
            <img src="img/game/lv9.jpg" alt="">
          </div>
          <p class="game-card-desc">把豆包、Grok 等十位 AI 角色圆章一步步合成终极大肥鱼！鼠标或触屏都能玩。</p>
          <div class="game-card-best">我的最高分：<b id="homeBest">0</b></div>
          <a class="more" href="game.html">来一局合成大肥鱼 →</a>
        </section>

        <a class="sticky rv" href="manual.html">
          <span class="pin" aria-hidden="true"></span>
          <strong>第一次来？</strong>
          <span>先看看说明书，认识一下大肥鱼和捷米奈的设定、口头禅与背后的小故事。</span>
          <em>查看说明书 →</em>
        </a>
      </div>

      <section class="s12 panel glass rv">
        <h2><span class="tag">STATS</span>小站数据</h2>
        <div class="tiles tiles-row" id="tiles"></div>
        <a class="more" href="stats.html">更多统计 →</a>
      </section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="common.js?v=20261127c"></script>
  <script>
    const T = TANK, $ = (id) => document.getElementById(id);
    $("title").textContent = T.site.title;
    $("welcome").textContent = T.site.welcome;
    let heroMode = localStorage.getItem("fanwen_hero_mode") === "chibi" ? "chibi" : "anime";
    const applyHero = () => {
      $("heroImg").src = heroMode === "chibi" ? "img/hero-chibi.jpg" : "img/hero-main.jpg";
      $("heroSwitch").textContent = heroMode === "chibi" ? "✦ 切换正比" : "✦ 切换 Q版";
    };
    $("heroSwitch").addEventListener("click", () => {
      heroMode = heroMode === "chibi" ? "anime" : "chibi";
      localStorage.setItem("fanwen_hero_mode", heroMode);
      applyHero();
    });
    applyHero();
    $("heroTags").innerHTML = Object.values(T.characters).map((c) => `
      <span class="char-pill" style="--pill-c:${c.bubble}">
        <img src="${UI.esc(c.avatar)}" alt="">
        <span>${UI.esc(c.name)}</span>
        <small>${UI.esc(c.species)}</small>
      </span>`).join("");
    $("cast").innerHTML = UI.castCards();
    $("liveHead").insertAdjacentHTML("beforeend", UI.demoBadge());
    $("mini").innerHTML = UI.renderChat(T.messages.slice(-4), { days: false });

    const bestScore = Number(localStorage.getItem("fanwen_bigfatfish_best") || 0);
    $("homeBest").textContent = bestScore;

    const days = Math.max(1, Math.floor((new Date() - UI.parseDate(T.site.startDate)) / 86400000) + 1);
    const activeDays = new Set(T.messages.map((m) => m.date)).size;
    $("tiles").innerHTML = [
      [days, "开张天数"], [T.messages.length, "聊天条数"], [activeDays, "有聊天的天数"], [bestScore, "大肥鱼最高分"]
    ].map(([n, l]) => `<div class="tile"><b>${n}</b><span>${l}</span></div>`).join("");

    UI.reveal();
  </script>
</body>
</html>
